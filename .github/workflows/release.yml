# Terraform Provider release workflow.
name: Release

# This GitHub action creates a release when a tag that matches the pattern
# "v*" (e.g. v0.1.0) is created.
on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub considers creating releases and uploading assets as writing contents.
      pull-requests: read # The release notes take their entries from the pull request descriptions.
      issues: read # The release notes name the issues that a pull request closed.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser and the release notes need the older tags.
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env] only a pushed v* tag starts this workflow
          passphrase: ${{ secrets.PASSPHRASE }} # zizmor: ignore[secrets-outside-env] only a pushed v* tag starts this workflow
      - name: Write the release notes
        run: nix develop -c go run ./tools/releaser "$(git describe --tags --abbrev=0 HEAD^)..HEAD" > "$RUNNER_TEMP/release-notes.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run GoReleaser
        run: nix develop -c goreleaser release --clean --release-notes "$RUNNER_TEMP/release-notes.md"
        env:
          # GitHub sets the GITHUB_TOKEN secret automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
