# Terraform Provider testing workflow.
name: Tests

# This GitHub action runs your tests for each pull request and push.
# Optionally, you can turn it on using a schedule for regular testing.
#
# No `paths-ignore` on either trigger, deliberately: a workflow skipped that way never reports its
# checks, so a required check on it stays "expected" forever and blocks the merge. A skipped *job*
# reports success; a skipped *workflow* does not.
on:
  pull_request:
  push:
    branches:
      - main

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Go Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod tidy
      - run: go build -v .
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after 'go mod tidy'. Run 'go mod tidy' command and commit."; exit 1)

  golangci:
    needs: [ build ]
    name: Go Lint and Format Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # Required for only-new-issues on PRs
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The repository's pinned Go, because it is what builds the linter in the next step.
          go-version-file: 'go.mod'
          cache: true
      # Built here rather than downloaded by the action below, because golangci-lint's formatters
      # use the go/format compiled into the binary: the formatting they enforce comes from the Go
      # release that BUILT the linter, not from the toolchain on PATH.
      - name: Build the pinned golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # The action is here for the annotations it puts on the pull request diff, which a bare
          # `run:` does not produce.
          install-mode: none
          only-new-issues: true  # Show only issues in changed code on PRs
      - name: Suggest fix command on failure
        if: failure()
        run: |
          echo "::error::Linting or formatting issues detected. Run 'task lint -- --fix' locally to automatically fix these issues, then commit the changes."

  shellcheck:
    name: Shell Lint (CI scripts)
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # shellcheck ships in the ubuntu-latest image, so no install step is needed.
      - name: shellcheck
        run: shellcheck .github/scripts/*.sh
      - name: Suggest fix command on failure
        if: failure()
        run: |
          echo "::error::shellcheck found issues in .github/scripts. Run 'task lint:shell' locally to reproduce."

  generate:
    name: Generate Terraform Provider Docs
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: go generate
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'go generate ./...' command and commit."; exit 1)

  test:
    name: Go Test
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # For PR comments
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # For base branch coverage comparison
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      # The mock tests (TF_ACC unset -> IsUnitTest) still drive a real CLI. Left to auto-install one,
      # the framework races parallel exec against its own download ("text file busy"/ETXTBSY, plus
      # occasional 502s); pin a pre-installed tofu instead.
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false
      # Coverage lands in a binary coverage-data directory (GOCOVERDIR format) rather than a text
      # profile, because the instrumented binaries flush it on exit even when a test fails.
      - name: Run unit tests with gotestsum
        env:
          # OpenTofu resolves the test provider's legacy "-" namespace only against this host.
          TF_ACC_PROVIDER_HOST: registry.opentofu.org
        run: |
          export TF_ACC_TERRAFORM_PATH="$(command -v tofu)"
          mkdir -p covdata/unit
          go tool gotestsum --junitfile junit.xml --format testdox -- \
            -coverpkg=./... ./... -args -test.gocoverdir="$PWD/covdata/unit"

      - name: Post coverage to PR
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: .github/scripts/coverage-comment.sh
