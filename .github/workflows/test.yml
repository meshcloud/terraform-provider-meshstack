# Terraform Provider testing workflow.
name: Tests

# This GitHub action runs your tests for each pull request and push.
# Optionally, you can turn it on using a schedule for regular testing.
#
# No `paths-ignore` on either trigger, deliberately: a workflow skipped that way never reports its
# checks, so a required check on it stays "expected" forever and blocks the merge. A skipped *job*
# reports success; a skipped *workflow* does not.
on:
  pull_request:
  push:
    branches:
      - main

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: nix develop -c bash -eo pipefail {0}

jobs:
  build:
    name: Go Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}
      - run: go mod tidy
      - run: go build -v .
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after 'go mod tidy'. Run 'go mod tidy' command and commit."; exit 1)

  # The acceptance run builds against a go.work with the meshstack-cli branch of the same name, which
  # hides the go.mod pin. Pull requests only, so a new meshstack-cli commit never turns main red.
  cli-pin:
    name: meshstack-cli Pin
    if: github.event_name == 'pull_request'
    needs: [ build ]
    runs-on: ubuntu-latest
    env:
      # A fresh branch commit is not always on the module proxy and checksum database yet.
      GOPRIVATE: github.com/meshcloud/meshstack-cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}
      - name: Build against the meshstack-cli branch of the same name
        env:
          BRANCH: ${{ github.head_ref }}
          CLI_REPO: https://github.com/meshcloud/meshstack-cli
        run: |
          if git ls-remote --exit-code --heads "$CLI_REPO" "refs/heads/$BRANCH" >/dev/null; then
            git clone --quiet --depth=1 --branch "$BRANCH" "$CLI_REPO" "$RUNNER_TEMP/meshstack-cli"
            go work init . "$RUNNER_TEMP/meshstack-cli"
          fi
      - run: tools/check-cli-pin.sh

  golangci:
    needs: [ build ]
    name: Go Lint and Format Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # Required for only-new-issues on PRs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}
      # Built here rather than downloaded by the action below, because golangci-lint's formatters
      # use the go/format compiled into the binary: the formatting they enforce comes from the Go
      # release that BUILT the linter, not from the toolchain on PATH.
      - name: Build the pinned golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint
          {
            echo "$(go env GOPATH)/bin"
            dirname "$(command -v go)"
          } >> "$GITHUB_PATH"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # The action is here for the annotations it puts on the pull request diff, which a bare
          # `run:` does not produce.
          install-mode: none
          only-new-issues: true  # Show only issues in changed code on PRs
      - name: Suggest fix command on failure
        if: failure()
        run: |
          echo "::error::Linting or formatting issues detected. Run 'task lint -- --fix' locally to automatically fix these issues, then commit the changes."

  zizmor:
    name: Workflow Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - run: task lint:actions

  govulncheck:
    needs: [ build ]
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}
      - run: go tool govulncheck ./...

  generate:
    name: Generate Terraform Provider Docs
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}
      - run: go generate
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'go generate ./...' command and commit."; exit 1)

  test:
    name: Go Test
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}
      - run: task test:coverage

      # meshfed-release merges this with its acceptance coverage and posts the single coverage
      # comment. It finds the run by the pull request head sha, so this has to be uploaded from a
      # `pull_request` job. Contract with that side: the name `covdata-unit`, and covmeta.*/
      # covcounters.* at the artifact root — which naming the directory gives, where a glob would
      # nest them.
      - name: Upload unit coverage data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: covdata-unit
          path: covdata/unit
          retention-days: 3

      # The merged comment needs an acceptance run; this figure does not, so it is still reported on
      # a fork pull request and on a push to main.
      - name: Report unit coverage
        if: always()
        run: |
          if ! ls covdata/unit/covmeta.* >/dev/null 2>&1; then
            echo "Unit coverage: no data produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          go tool covdata textfmt -i=covdata/unit -o=unit.txt
          echo "Unit coverage: $(go tool cover -func=unit.txt | tail -1 | awk '{print $NF}')" >> "$GITHUB_STEP_SUMMARY"
