version: '3'

dotenv: ['.env']

tasks:
  testacc:
    desc: Run acceptance tests
    env: &tofu
      # Without it, terraform-plugin-testing downloads a terraform when a test starts.
      TF_ACC_TERRAFORM_PATH:
        sh: command -v tofu
      # OpenTofu resolves the test provider's legacy "-" namespace only against this host.
      TF_ACC_PROVIDER_HOST: registry.opentofu.org
    cmds:
      # -count=1 disables Go's test result cache — acceptance tests test a live service (e.g. meshfed-api), whose changes are invisible to Go's source-based cache
      - TF_ACC=1 go test ./... -v -count=1 -timeout 120m {{.CLI_ARGS}}

  test:
    desc: Run unit tests only
    env: *tofu
    cmds:
      - go test ./... -v {{.CLI_ARGS}} -short

  test:coverage:
    desc: Run unit tests and write the coverage data that CI uploads
    env: *tofu
    cmds:
      - mkdir -p covdata/unit
      # Coverage lands in a binary coverage-data directory (GOCOVERDIR format) rather than a text
      # profile, because only the binary form can be merged with the acceptance run's coverage — and
      # the instrumented binaries flush it on exit even when a test fails. `-coverpkg=./...` has to
      # match what meshfed-release runs the acceptance suite with: instrument different package sets
      # and the merged figure is a ratio over two different denominators.
      - >-
        go tool gotestsum --junitfile junit.xml --format testdox --
        -coverpkg=./... ./... -args -test.gocoverdir="{{.ROOT_DIR}}/covdata/unit"

  build:
    desc: Build the provider
    cmds:
      - go build {{.CLI_ARGS}} -o terraform-provider-meshstack

  install:
    desc: Install provider locally for testing
    cmds:
      - go install {{.CLI_ARGS}}

  lint:
    desc: Run golangci-lint and zizmor
    cmds:
      # `go tool`, not a binary on PATH: golangci-lint's formatters use the go/format compiled into
      # it, so the formatting they enforce comes from the Go that BUILT the linter.
      - go tool golangci-lint run {{.CLI_ARGS}}
      - task: lint:actions

  lint:actions:
    desc: Check the GitHub Actions workflows and the Dependabot config with zizmor
    cmds:
      - zizmor --offline ${GITHUB_ACTIONS:+--format=github} .

  cli:pin:
    desc: Check that go.mod pins the meshstack-cli sources that the go.work builds against
    cmds:
      - tools/check-cli-pin.sh

  vuln:
    desc: Check for known vulnerabilities with govulncheck
    cmds:
      - go tool govulncheck {{.CLI_ARGS}} ./...

  generate:
    desc: Generate documentation
    cmds:
      - go generate {{.CLI_ARGS}}

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -f terraform-provider-meshstack
      - rm -rf .terraform
      - rm -f .terraform.lock.hcl
