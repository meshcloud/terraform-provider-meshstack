version: '3'

dotenv: ['.env']

tasks:
  testacc:
    desc: Run acceptance tests
    env:
      TF_ACC: 1
    cmds:
      # -count=1 disables Go's test result cache — acceptance tests test a live service (e.g. meshfed-api), whose changes are invisible to Go's source-based cache
      - go test ./... -v -count=1 {{.CLI_ARGS}} -timeout 120m

  test:
    desc: Run unit tests only
    cmds:
      - go test ./... -v {{.CLI_ARGS}} -short

  build:
    desc: Build the provider
    cmds:
      - go build {{.CLI_ARGS}} -o terraform-provider-meshstack

  install:
    desc: Install provider locally for testing
    cmds:
      - go install {{.CLI_ARGS}}

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run {{.CLI_ARGS}}

  lint:shell:
    desc: Shellcheck the CI scripts in .github/scripts
    cmds:
      - shellcheck .github/scripts/*.sh

  generate:
    desc: Generate documentation
    cmds:
      - go generate {{.CLI_ARGS}}

  cli:link:
    desc: Build and test against the sibling ../meshstack-cli checkout instead of the version pinned in go.mod
    # A git-ignored go.work, never an in-tree `go mod edit -replace`: go.mod and go.sum stay
    # byte-for-byte unchanged, so the redirect cannot be committed by accident, CI's `go mod tidy` diff
    # check keeps its meaning, and a dependency the CLI checkout adds needs no go.sum entry here. The
    # acceptance job in .github/workflows/test.yml does the same against its own CLI checkout.
    cmds:
      - go work init . ../meshstack-cli
      - echo "Linked ../meshstack-cli. Run 'task cli:unlink' to go back to the pinned version."

  cli:unlink:
    desc: Stop using ../meshstack-cli and go back to the version pinned in go.mod
    cmds:
      - rm -f go.work go.work.sum

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -f terraform-provider-meshstack
      - rm -rf .terraform
      - rm -f .terraform.lock.hcl
