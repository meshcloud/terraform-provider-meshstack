sonar.projectKey=meshcloud_terraform-provider-meshstack
sonar.organization=meshcloud

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=\
  **/*_test.go,\
  internal/clientmock/**,\
  internal/provider/acctest/**
# A file is either source or test, so the sources exclude the test patterns.
sonar.exclusions=\
  **/*_test.go,\
  internal/clientmock/**,\
  internal/provider/acctest/**,\
  **/testdata/**,\
  docs/**

# The coverage report holds Go only.
sonar.coverage.exclusions=\
  **/*.sh,\
  **/*.kts

# Terraform here is examples, test data and the repository settings in infra/github.
sonar.terraform.activate=false

# Cognitive complexity (S3776) and duplicated string literals (S1192) are accepted.
sonar.issue.ignore.multicriteria=goS3776,goS1192,shellS1192,githubactionsS1192
sonar.issue.ignore.multicriteria.goS3776.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.goS3776.resourceKey=**/*
sonar.issue.ignore.multicriteria.goS1192.ruleKey=go:S1192
sonar.issue.ignore.multicriteria.goS1192.resourceKey=**/*
sonar.issue.ignore.multicriteria.shellS1192.ruleKey=shell:S1192
sonar.issue.ignore.multicriteria.shellS1192.resourceKey=**/*
sonar.issue.ignore.multicriteria.githubactionsS1192.ruleKey=githubactions:S1192
sonar.issue.ignore.multicriteria.githubactionsS1192.resourceKey=**/*
