# Visit https://golangci-lint.run/ for usage documentation
# and information on other useful linters
version: "2"
issues:
  max-same-issues: 0

formatters:
  enable:
    - gci
    - gofmt
  settings:
    gci:
      sections:
        - standard     # Go standard library
        - default      # All other external dependencies
        - localmodule  # This repository's modules

linters:
  default: none
  enable:
    - depguard
    - durationcheck
    - errcheck
    - copyloopvar
    - forcetypeassert
    - godot
    - ineffassign
    - makezero
    - misspell
    - nilerr
    - predeclared
    - staticcheck
    - usetesting
    - unconvert
    - unparam
    - unused
    - govet
    - testifylint
    - thelper
  settings:
    depguard:
      # Every directory pattern is listed twice, as '**/dir/*.go' and
      # '**/dir/**/*.go'. The second form matches files in subdirectories of dir
      # only, never files directly inside it, so on its own it silently governs
      # nothing in a flat package. A rule that matches no file reports no issue,
      # which is indistinguishable from a rule that passes — check any new rule by
      # compiling a file that violates it.
      rules:
        # The 'client' and 'client-test' rules moved to meshstack-cli together with the
        # client package. That repository keeps the client free of external
        # dependencies, which is what keeps them out of this provider's dependency tree.
        provider:
          files:
            - "!$test"
            - "!**/internal/clientmock/*.go"
            - "!**/internal/clientmock/**/*.go"
            - "!**/internal/provider/acctest/*.go"
            - "!**/internal/provider/acctest/**/*.go"
            - "!**/examples/*.go"
          list-mode: strict
          deny:
            - pkg: log # as $gostd is allowed
              desc: Always use 'hclog' or SDK logging
            - pkg: github.com/meshcloud/terraform-provider-meshstack/internal/clientmock
              desc: clientmock package must only be used in tests
          allow:
            - $gostd
            # explicitly specifying the 'internal' suffix prevents the 'examples'
            # package from being included in non-test files
            - github.com/meshcloud/terraform-provider-meshstack/internal
            - github.com/meshcloud/meshstack-cli/client
            - github.com/meshcloud/meshstack-cli/pkg/login
            - github.com/hashicorp/terraform-plugin-framework/
            - github.com/hashicorp/terraform-plugin-sdk/v2/helper/retry
            - github.com/hashicorp/terraform-plugin-framework-jsontypes/jsontypes # for 'any' value support
            - github.com/hashicorp/terraform-plugin-framework-validators
            - github.com/hashicorp/terraform-plugin-framework-timeouts # for resource timeouts block
            - github.com/hashicorp/terraform-plugin-go
            - github.com/hashicorp/terraform-plugin-log
            - github.com/gabriel-vasile/mimetype
        provider-test:
          files:
            - "$test"
            - "**/internal/clientmock/*.go"
            - "**/internal/clientmock/**/*.go"
            - "**/internal/provider/acctest/*.go"
            - "**/internal/provider/acctest/**/*.go"
            - "**/examples/*.go"
            - "!**/internal/types/*.go"
            - "!**/internal/types/**/*.go"
            - "!**/internal/provider/provider_test.go" # contains common adapters for all tests, using non-testing deps.
          list-mode: strict
          # The former deny on client/internal is gone: it now lives in another module,
          # where Go's internal rule makes it unreachable from here outright.
          allow:
            - $gostd
            - github.com/meshcloud/terraform-provider-meshstack # any packages are included in tests
            - github.com/meshcloud/meshstack-cli
            - github.com/hashicorp/terraform-plugin-testing
            - github.com/hashicorp/terraform-plugin-framework/diag
            - github.com/hashicorp/hcl/v2 # hclwrite-based config manipulation in examples/
            - github.com/zclconf/go-cty/cty # hclwrite value types
            - github.com/stretchr/testify
            - github.com/google/uuid # clientmock assigns UUIDs to the meshObjects it stores
        types:
          files:
            - "**/internal/types/*.go"
            - "**/internal/types/**/*.go"
            - "!$test"
          list-mode: strict
          deny:
            - pkg: log # as $gostd is allowed
              desc: Always use 'hclog' or SDK logging
          allow:
            - $gostd
            - github.com/meshcloud/meshstack-cli/client/types # only types should be used from client, if at all!
            - github.com/meshcloud/terraform-provider-meshstack/internal/util/
            - github.com/meshcloud/terraform-provider-meshstack/internal/types/
            - github.com/hashicorp/terraform-plugin-framework/
            - github.com/hashicorp/terraform-plugin-go/tftypes
        types-test:
          files:
            - "**/internal/types/*_test.go"
            - "**/internal/types/**/*_test.go"
          list-mode: strict
          deny:
            - pkg: log # as $gostd is allowed
              desc: Always use 'hclog' or SDK logging
          allow:
            - $gostd
            - github.com/meshcloud/terraform-provider-meshstack/internal/util/
            - github.com/meshcloud/terraform-provider-meshstack/internal/types/
            - github.com/hashicorp/terraform-plugin-framework/
            - github.com/hashicorp/terraform-plugin-framework-jsontypes/jsontypes
            - github.com/hashicorp/terraform-plugin-go/tftypes
            - github.com/stretchr/testify
